[pytest]
testpaths = test_livraria.py test_avaliacoes.py test_interface_avaliacoes.py
filterwarnings =
    ignore:.*maxsplit.*positional argument:DeprecationWarning:gherkin.gherkin_line
markers =
    interface: teste opcional no navegador instalado, com Playwright
    E1-01: busca por título ou autor
    E1-02: quantidade em estoque
    E1-03: filtro por gênero
    E1-04: lançamentos da semana
    E1-05: aviso de reposição
    E1-06: recomendações por compras
    E1-07: leitura de avaliações
    E1-08: publicação de avaliações com nota e comentário
    E2-01: seção e prateleira
    E2-02: código de barras
    E2-03: fila virtual
    E2-04: atendimento com livreiro
    E2-05: funcionamento e lotação
    E3-01: reserva
    E3-02: prazo de retirada
    E3-03: reserva pronta
    E3-04: cancelamento
    E4-01: pontos por compra
    E4-02: saldo de pontos
    E4-03: cupons
    E4-04: cartão digital
    E4-05: expiração de pontos
    E5-01: agenda de eventos
    E5-02: inscrição
    E5-03: lembrete de evento
    E5-04: clube de leitura
    E6-01: lista de desejos
    E6-02: histórico de compras
    E6-03: gêneros preferidos
    E6-04: temas de notificação
    E6-05: presente com embrulho
